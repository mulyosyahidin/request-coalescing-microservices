global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "krakend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["krakend-gateway:9091"]

  - job_name: "auth-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["auth-service:8080"]

  - job_name: "product-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["product-service:8080"]

  - job_name: "order-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["order-service:8080"]


  - job_name: "payment-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["payment-service:8080"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["auth-db-exporter:9187", "product-db-exporter:9187", "order-db-exporter:9187", "payment-db-exporter:9187"]
