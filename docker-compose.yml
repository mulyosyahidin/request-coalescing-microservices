# ==============================================================================
# Docker Compose - RequestCoalescing Local Development Environment
# 
# Dirancang dengan prinsip "Cloud-Ready / GKE Parity":
# 1. Tidak ada kredensial atau host yang di-hardcode (mematuhi Rule 6.1.5)
# 2. Database-per-service pattern (PostgreSQL terisolasi)
# 3. Service discovery berbasis DNS container name
# ==============================================================================

name: request-coalescing

networks:
  rc-network:
    name: rc-network
    driver: bridge

volumes:
  auth_db_data:
  product_db_data:
  order_db_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    restart: unless-stopped
    ports:
      - "8089:8080"
    volumes:
      - ./openapi.yaml:/openapi.yaml
    environment:
      SWAGGER_JSON: /openapi.yaml
    networks:
      - rc-network

  # ============================================================================
  # 1. Databases (PostgreSQL 16)
  # ============================================================================
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rc-network

  product-db:
    image: postgres:16-alpine
    container_name: product-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PRODUCT_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD}
      POSTGRES_DB: ${PRODUCT_DB_NAME}
    ports:
      - "${PRODUCT_DB_PORT}:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCT_DB_USER} -d ${PRODUCT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rc-network

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME}
    ports:
      - "${ORDER_DB_PORT}:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER} -d ${ORDER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rc-network

  # ============================================================================
  # 2. Golang Microservices
  # ============================================================================
  auth-service:
    build:
      context: ./microservices/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      PORT: ${APP_PORT}
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${AUTH_DATABASE_URL}
    ports:
      - "${AUTH_SERVICE_HOST_PORT}:${APP_PORT}"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - rc-network

  product-service:
    build:
      context: ./microservices/product-service
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    environment:
      PORT: ${APP_PORT}
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${PRODUCT_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${PRODUCT_SERVICE_HOST_PORT}:${APP_PORT}"
    depends_on:
      product-db:
        condition: service_healthy
    networks:
      - rc-network

  order-service:
    build:
      context: ./microservices/order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      PORT: ${APP_PORT}
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${ORDER_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
    ports:
      - "${ORDER_SERVICE_HOST_PORT}:${APP_PORT}"
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - rc-network

  # ============================================================================
  # 3. API Gateway (KrakenD)
  # ============================================================================
  krakend:
    image: devopsfaith/krakend:2.7
    container_name: krakend-gateway
    restart: unless-stopped
    ports:
      - "${KRAKEND_PORT}:${KRAKEND_PORT}"
    volumes:
      - ./api-gateway/krakend.json:/etc/krakend/krakend.json:ro
    environment:
      KRAKEND_PORT: ${KRAKEND_PORT}
    depends_on:
      - auth-service
      - product-service
      - order-service
    networks:
      - rc-network

  # ============================================================================
  # 4. Observability Stack
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_HOST_PORT}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - rc-network

  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    restart: unless-stopped
    ports:
      - "${LOKI_HOST_PORT}:3100"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - rc-network

  alloy:
    image: grafana/alloy:v1.2.0
    container_name: alloy
    restart: unless-stopped
    ports:
      - "${ALLOY_HOST_PORT}:12345"
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - rc-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - rc-network
